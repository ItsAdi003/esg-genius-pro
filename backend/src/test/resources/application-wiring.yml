# Production-style wiring test profile: H2 DB, no test-profile classification stub
spring:
  datasource:
    url: jdbc:h2:mem:wiringdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  storage:
    upload-dir: target/wiring-test-uploads
  ai:
    gemini:
      api-key: wiring-test-key
      model: gemini-3.5-flash
      thinking-level: low
      inter-request-delay: 0ms
