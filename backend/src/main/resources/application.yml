spring:
  application:
    name: esgenius-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/esgenius}
    username: ${DB_USERNAME:esgenius}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info
