spring:
  application:
    name: esgenius-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/esgenius}
    username: ${DB_USERNAME:esgenius}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8081

app:
  storage:
    upload-dir: uploads
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      connect-timeout: 10s
      read-timeout: 60s
      thinking-level: low
      max-retries: 2
      initial-retry-backoff: 500ms
      max-retry-backoff: 8s
      inter-request-delay: 300ms

management:
  endpoints:
    web:
      exposure:
        include: health, info
